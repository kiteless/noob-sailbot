name = "noob-sailbot"
main = "worker/index.js"
compatibility_date = "2024-11-06"

[triggers]
# The Worker wakes hourly and decides for itself whether to post, using
# schedule.localHour and schedule.timezone from config.jsonc. That keeps all
# timing in one human-editable place, needs no cron edits when the post time
# changes, and follows daylight saving in any timezone automatically.
# 24 invocations a day is negligible against the 100,000/day free tier.
crons = ["0 * * * *"]

# config.jsonc is bundled into the Worker at deploy time (Workers have no
# filesystem at runtime). This rule imports it as a string so the comments
# survive; the Worker parses it with parseJsonc().
[[rules]]
type = "Text"
globs = ["**/*.jsonc"]
fallthrough = true

# No [vars] here on purpose. wrangler.toml is committed, and the Discord
# application ID / public key identify one specific bot instance — keeping them
# as secrets leaves the repo free of instance data and fork-ready:
#   wrangler secret put DISCORD_PUBLIC_KEY
#   wrangler secret put DISCORD_APPLICATION_ID
#   wrangler secret put DISCORD_WEBHOOK_URL
#
# config.jsonc must exist locally before `wrangler deploy`, and any config
# change requires another deploy to take effect.
